    ```python
    Q = 3329
    def _br7(i):
        return int(format(i, "07b")[::-1], 2)
    ZETAS = [pow(17, _br7(i), Q) for i in range(128)]

    def ntt(a):
        a = list(a); k = 1; length = 128
        while length >= 2:
            for start in range(0, 256, 2 * length):
                zeta = ZETAS[k]; k += 1
                for j in range(start, start + length):
                    t = (zeta * a[j + length]) % Q
                    a[j + length] = (a[j] - t) % Q
                    a[j] = (a[j] + t) % Q
            length //= 2
        return a

    def invntt(a):
        a = list(a); k = 127; length = 2
        while length <= 128:
            for start in range(0, 256, 2 * length):
                zeta = ZETAS[k]; k -= 1
                for j in range(start, start + length):
                    t = a[j]
                    a[j] = (t + a[j + length]) % Q
                    a[j + length] = (zeta * (a[j + length] - t)) % Q
            length *= 2
        return [(x * 3303) % Q for x in a]
